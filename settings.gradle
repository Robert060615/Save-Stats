pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // Enforces centralized repository declaration; prevents subprojects from
    // overriding or injecting unapproved third-party repositories.
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        mavenCentral()
    }
}

rootProject.name = 'save-stats'

include("app")

// Another student's module, copied in unchanged. See vendor/README.md.
include("savechecker")
project(":savechecker").projectDir = file("vendor/savechecker")

// Composite build: pulls in the custom build logic and convention plugins.
includeBuild("build-logic")
