plugins {
    // Shared convention plugins for the Java toolchain, static analysis, and test lifecycle.
    id 'lnu.java-conventions'
    id 'lnu.quality-conventions'
    id 'lnu.testing-conventions'

    // Packages and runs the module as a CLI application.
    id 'application'
}

group = 'se.lnu.rm222xi.savestats'
version = '1.0.0'

application {
    mainClass = 'se.lnu.rm222xi.savestats.App'
}

dependencies {
    implementation 'com.github.Robert060615:svg-charts-module:v1.1.0'
    implementation project(':savechecker')

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly    libs.junit.jupiter.engine
    testRuntimeOnly    "org.junit.platform:junit-platform-launcher"
}

// Lets the menu read from the terminal when started with ./gradlew run.
tasks.named('run') {
    standardInput = System.in
}